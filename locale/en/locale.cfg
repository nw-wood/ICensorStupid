[mod-description]
ICensorStupid=Because you don't want to be reminded of the existence of brownslurper420 while building a train network or laboratory farm. Removes random backer names from newly built and existing Labs, Roboports, Radars, and Locomotives, renames default Train stops to 'Train stop', and renames default Space platforms to 'Space station'.
